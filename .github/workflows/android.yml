name: Android

on:
  push:
    branches: [main]
  pull_request:
    paths: ['android/**', 'app/**', 'capacitor.config.json', 'package*.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Install JS deps and sync web bundle into the Android project
        run: npm ci && npx cap sync android

      - name: Web quality gates (syntax, 45 unit tests, release validation)
        run: npm run verify

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build Release AAB (unsigned unless keystore secrets are provided)
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  launch-test:
    name: Launch test on Android emulator
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: app-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install APK, launch app, assert process alive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            adb install app-debug.apk
            adb shell monkey -p com.focusflow.app -c android.intent.category.LAUNCHER 1
            sleep 15
            PID=$(adb shell pidof com.focusflow.app | tr -d '[:space:]')
            if [ -z "$PID" ]; then
              echo "LAUNCH FAILED: process not running"; adb shell dumpsys activity top | tail -30; exit 1
            fi
            echo "LAUNCH OK: com.focusflow.app running with pid $PID"
            adb shell dumpsys activity processes | grep -m1 "com.focusflow.app" || true
