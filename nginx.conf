server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml application/json;
  gzip_min_length 512;

  # Landing at root.
  location = / {
    try_files /landing/index.html =404;
    add_header Cache-Control "no-cache";
  }

  # Immutable hashed-by-version assets (icons) — long cache.
  location ~* \.(?:png|jpg|svg)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  # JS/CSS — short cache; revalidate often so SW updates roll out.
  location ~* \.(?:js|css|webmanifest)$ {
    expires 1h;
    add_header Cache-Control "public";
  }

  location ~* \.html$ {
    add_header Cache-Control "no-cache";
  }

  # Security headers (no CSP nonce needed: our JS is module files only).
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ =404;
  }
}
